# Local Nextcloud and MinIO for testing Vautix's cloud backups end-to-end.
# This is NOT part of the app; it's throwaway WebDAV and S3 servers you run on
# your own machine to exercise the backup path without a cloud account.
#
#   docker compose up -d       # start them (Nextcloud's first boot installs, ~30-90s)
#   docker compose logs -f      # watch until Apache is serving requests
#   docker compose down         # stop + remove the containers
#   docker compose down -v      # ...and wipe the data volumes for a clean slate
#
# With both up, the provider integration suite runs against them:
#   VAUTIX_IT=1 pnpm --filter @vault/core exec vitest run providers.integration
#
# Once it's up, point Vautix's WebDAV provider at:
#   Server URL: http://localhost:8080/remote.php/dav/files/admin/
#   Username:   admin
#   Password:   Vautix-test-123
# Backups land in a "vautix/" folder under that user's files. http://localhost
# works from the extension popup (host permissions bypass CORS; localhost is
# exempt from mixed-content blocking).

services:
  nextcloud:
    image: nextcloud:stable
    container_name: vautix-nextcloud
    ports:
      # host:container. Change the left port (8080) if something already uses it.
      - "8080:80"
    environment:
      # Setting these auto-runs the Nextcloud installer on first boot, so there's
      # no web setup wizard. SQLite keeps it to a single container, which is plenty
      # for testing (a real deploy would use MariaDB/Postgres + Redis).
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: Vautix-test-123
      # Without this, Nextcloud rejects requests with an "untrusted domain" error.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    volumes:
      # Persist the install + uploaded backups across restarts. Blow it away with
      # `docker compose down -v` to get a fresh, empty instance.
      - vautix-nextcloud-data:/var/www/html
    restart: unless-stopped

  # S3, for the other half of the backup code. MinIO validates SigV4 the way a real S3 endpoint
  # does, which is what makes it worth running: the signer has two implementations (WebCrypto in
  # TypeScript, and Rust for the desktop, which cannot reach a provider from its webview), and
  # test vectors only prove they agree with each other. This proves they agree with a server.
  #
  #   Endpoint: http://localhost:9000    Bucket: vautix-test
  #   Key: vautix                       Secret: vautix-test-secret
  # The console is on http://localhost:9001 if you want to look at what landed.
  minio:
    image: minio/minio:latest
    container_name: vautix-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vautix
      MINIO_ROOT_PASSWORD: vautix-test-secret
    volumes:
      - vautix-minio-data:/data
    restart: unless-stopped

  # Creates the bucket and exits. A one-shot rather than a manual step, so `docker compose up -d`
  # leaves an environment the tests can use with nothing else typed.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 vautix vautix-test-secret; do sleep 1; done;
      mc mb --ignore-existing local/vautix-test;
      echo 'bucket ready: vautix-test';
      "
    restart: "no"

volumes:
  vautix-nextcloud-data:
  vautix-minio-data:
